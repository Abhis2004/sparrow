name: sparrow
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^3.4.1
  go_router: ^17.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  flutter_localizations:
    sdk: flutter

  geolocator: ^13.0.2
  speech_to_text: ^7.0.0
  http: ^1.2.2

  isar_community: ^3.1.0+1
  isar_community_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  image_picker: ^1.2.3
  video_player: ^2.13.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  isar_community_generator: ^3.1.0+1
  build_runner: ^2.4.14

flutter_native_splash:
  color: "#ffffff"
  image: assets/splash/splash.png

  android_12:
    color: "#ffffff"
    image: assets/splash/splash.png


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/logo.png"

flutter:

  uses-material-design: true


